{% extends 'base.html' %}
{% block title %}Отклонить — Банк идей{% endblock %}
{% block content %}
  <h1 class="title">Отклонить «{{ idea.title }}»</h1>
  <div class="card" style="max-width:520px;">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Подтвердить отклонение</button>
    </form>
  </div>
{% endblock %}
