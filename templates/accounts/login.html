<!DOCTYPE html>
<html>
<head>
  <title>Вход — Банк идей</title>
  <link rel="stylesheet" href="/static/css/design-system.css">
</head>
<body style="background:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;">
  <div style="width:400px;">
    <div class="hx" style="text-align:center;margin-bottom:24px;font-size:20px;color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;"><span class="brand-mark"></span> Банк идей</div>
    <div class="card">
      {% if form.non_field_errors %}
        <div class="err" style="margin-bottom:14px;">{{ form.non_field_errors.0 }}</div>
      {% endif %}
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="field">
          <label>Логин</label>
          {{ form.username }}
        </div>
        <div class="field">
          <label>Пароль</label>
          {{ form.password }}
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Войти</button>
      </form>
      <p style="text-align:center;font-size:13px;color:var(--text2);margin-top:16px;margin-bottom:0;">Логин и пароль выдаёт администратор.<br>Самостоятельной регистрации нет.</p>
    </div>
  </div>
</body>
</html>
