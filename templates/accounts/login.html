<!DOCTYPE html>
<html>
<head>
  <title>Вход — Банк идей</title>
  <link rel="stylesheet" href="/static/css/design-system.css">
</head>
<body style="background:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;">
  <div class="card" style="width:360px;">
    <div class="hx" style="text-align:center;margin-bottom:20px;font-size:18px;">◆ Банк идей</div>
    {% if form.errors %}<p style="color:var(--d-rej-manager);">Неверный логин или пароль</p>{% endif %}
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary" style="width:100%;">Войти</button>
    </form>
  </div>
</body>
</html>
